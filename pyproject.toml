[project]
name = "postillon"
version = "0.1.0"
description = "Publishes videos to their platforms from manifests dropped in an S3-compatible bucket"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "python-dotenv>=1.2.4",
]

[project.scripts]
postillon = "postillon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postillon"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
